name: CI/CD

on:
  push:
    branches: [main]
    # Android releases: pushing android-v<version> builds the signed APK and attaches it to a GitHub Release.
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Public, non-secret build-time values (they end up in the JS bundle).
  VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload web build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
      - name: Upload API package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: api-deploy
          path: api/deploy
          retention-days: 7

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sed 's/gitleaks_.*$/gitleaks.tgz/' | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  deploy-web:
    name: Deploy web (Static Web Apps)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, secrets-scan]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SWA_HOSTNAME }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          api_location: ''
          skip_app_build: true
          skip_api_build: true

  deploy-api:
    name: Deploy API (Azure Functions)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, secrets-scan]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write # OIDC: federated credential on a user-assigned identity, no stored secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-deploy
          path: api-deploy
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: func-woutist
          package: api-deploy
          sku: flexconsumption

  android-test:
    name: Android unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build -w @woutist/web
      - run: npx cap sync android
        working-directory: web
      - run: ./gradlew testDebugUnitTest lintDebug
        working-directory: web/android

  android-release:
    name: Android release APK
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [android-test, secrets-scan]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write # attach the APK to the GitHub Release for the tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Version from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build -w @woutist/web
      - run: npx cap sync android
        working-directory: web
      - name: Build the signed APK
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WOUTIST_KEYSTORE_PATH: ${{ runner.temp }}/woutist-release.jks
          WOUTIST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WOUTIST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WOUTIST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WOUTIST_VERSION_CODE: ${{ github.run_number }}
          WOUTIST_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$WOUTIST_KEYSTORE_PATH"
          trap 'rm -f "$WOUTIST_KEYSTORE_PATH"' EXIT
          ./gradlew assembleRelease
          # Unsigned builds are named app-release-unsigned.apk; insist on the signed one.
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp web/android/app/build/outputs/apk/release/app-release.apk "woutist-${VERSION}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "Woutist for Android ${VERSION}" \
            --notes "Signed Android APK. Install it on your phone (allow installs from your browser or file manager), then sign in with your Microsoft account."
          gh release upload "$GITHUB_REF_NAME" "woutist-${VERSION}.apk" --clobber
